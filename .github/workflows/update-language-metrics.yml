name: Update language metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"

permissions:
  contents: write

jobs:
  update-languages:
    runs-on: ubuntu-latest
    steps:
      - name: Generate language distribution
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          filename: assets/metrics/languages.svg
          output_action: commit
          committer_message: "chore: update language metrics"
          user: Majestic-Pako
          template: classic
          base: ""
          config_animations: no
          config_padding: 8, 12 + 8, 12
          config_twemoji: no
          plugins_errors_fatal: yes
          verify: yes
          retries: 2
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%
          plugin_languages_other: yes
          plugin_languages_indepth: no
          plugin_languages_colors: github
          extras_css: |
            h2 { color: #4F8796 !important; }
            .field { color: #7D8590 !important; }
            .field svg { color: #83B8C6 !important; }
